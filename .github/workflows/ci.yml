# The game-free gate: everything that can run without a Slay the Spire 2
# install. Tests that need the game skip (Rust: cfg/probe-gated; Python: the
# `oracle` marker; web: existsSync guards), so a green run here proves the
# engine, the encoder/PPO stack and the web app — not parity with the game.
#
# This file lives ONLY in the public repository (added at export from the
# private repo's release/public-overlay/); the private repo runs local gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt, clippy, nextest, doctests, wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sts2-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sts2-rs
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - run: cargo check --target wasm32-unknown-unknown -p sts2-workbench-wasm

  python:
    name: python (pytest, game-free)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sts2-pycli
    steps:
      - uses: actions/checkout@v4
      # uv sync builds the sts2_rs PyO3 wheel from ../sts2-rs (editable path dep).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sts2-rs
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest tests -m "not oracle" -q

  web:
    name: web (vitest, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sts2-pycli/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sts2-pycli/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
