onnx = "ppo_fullrun_silent_cont_it300.onnx"
ckpt = "ppo_fullrun_silent_cont_it300.pt"
sha256 = "6397316f497f2faac9335acb0f73992edfb4b0e1834342d46be91fdc1e3a2b07"
gate = "PASSED its pre-registered gate 2026-09-08. +5.64pp pooled on 2200 paired cells (200 seeds x A0-A10, panel 76,000,000) vs ppo_fullrun_silent_deckmut_it150, McNemar exact two-sided p=6.9e-07; seed-clustered p=7.5e-04 (design effect 2.19x). ALL 11 levels positive, worst +2.50pp against a -5.0pp guard; overall 46.91% -> 52.55%; 0 errored rows in 4,400. This is the CONTROL arm of the Silent PLR A/B: PLR itself measured NULL on a separate 4400-cell panel (-1.07pp +/- 1.33pp, clustered p=0.42, |effect| < 2.60pp at 95%), so the promoted recipe is PLR-FREE. The gain is a 150-iteration continuation bundled with --act1 roll, reward_upgrade, cheap sims and 960 games/iter, and ATTRIBUTES NOTHING among them. Trained with STS2_RUNAI_POTION_SWAP=1, served with it OFF. See ppo_fullrun_silent_cont_it300.provenance.md and docs/experiments/2026-09-02-silent-plr-ab.md."
features = "reward_upgrade"

